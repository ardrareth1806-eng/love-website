<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Nandutty ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Floating Hearts -->
    <div class="hearts"></div>

    <!-- Stars -->
    <div class="rainbows"></div>

    <!-- Moon -->
    <div class="clouds"></div>

    <!-- Welcome -->
    <section class="hero">

        <h3>✨ Made with all my love ✨</h3>

        <h1>To The Love Of My Life ❤️</h1>

        <p>
            Every heartbeat,
            every smile,
            every dream...
            somehow leads me back to you.
        </p>

        <button id="openBtn">
            💌 Here you go
        </button>

    </section>

    <!-- Envelope -->
    <section class="envelope-page hidden">

        <div class="envelope">

            <div class="top"></div>

            <div class="letter">

                <h2>Hey Love ❤️</h2>

                <p>
                    This little website holds pieces of my heart.
                </p>

                <button id="readLetter">
                    Read My Letter 💖
                </button>

            </div>

        </div>

    </section>

    <!-- Hidden Love Note -->
    <section class="love-note hidden">

        <h1>I Love You Lots ❤️</h1>

        <p>

            No matter how many miles separate us...

            you'll always be my favorite place.

        </p>

        <div class="buttons">

            <a href="letter.html">
                <button>
                    Go on ❤️
                </button>
            </a>

        </div>

    </section>

<script src="script.js"></script>

</body>
</html>
